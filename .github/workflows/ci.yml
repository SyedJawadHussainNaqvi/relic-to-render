name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Daily re-audit so newly published advisories are caught without a push.
    - cron: "0 3 * * *"

jobs:
  audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit dependencies (fails on high/critical, reports TanStack issues)
        run: npm run security:deps
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: reports/dependency-audit.json
          if-no-files-found: ignore

  build:
    name: Build and structured-data checks
    runs-on: ubuntu-latest
    needs: audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build:static
